spring:
  application:
    name: mvp

  datasource:
    url: jdbc:postgresql://localhost:5432/shiftpay
    username: shiftpay
    password: shiftpay
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    user: shiftpay
    password: shiftpay
    placeholders:
      default_timezone: ${shiftpay.default-time-zone}

  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${SMTP_READ_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}

security:
  jwt:
    secret: ${JWT_SECRET:shiftpay-dev-secret-change-me}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}

shiftpay:
  default-time-zone: ${SHIFTPAY_DEFAULT_TIME_ZONE:Europe/Berlin}
  cursor:
    secret: ${SHIFTPAY_CURSOR_SECRET:shiftpay-dev-cursor-secret-change-me}
  email:
    from: ${SHIFTPAY_EMAIL_FROM:no-reply@shiftpay.invalid}
    smtp:
      enabled: ${SHIFTPAY_EMAIL_SMTP_ENABLED:false}
